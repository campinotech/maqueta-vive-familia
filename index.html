<!DOCTYPE html>
<html lang="es">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vive Familia en la Empresa · Maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1E73; --blue:#0188C8; --cyan:#00A0D1; --green:#70B234;
  --green-50:#EFF7E7; --blue-50:#E8F4FB; --cyan-50:#E5F6FB;
  --ink:#1B2440; --ink-2:#4A5574; --ink-3:#7C86A2; --line:#E3E9F2;
  --bg:#F4F8FB; --card:#FFFFFF; --warn:#C77700; --warn-50:#FFF5E5;
  --fin-navy:#05308A; --fin-cyan:#08A6E0;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#E9EFF5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- demo bar ---------- */
.demobar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:50}
.demobar img{height:34px}
.demobar .t{font-weight:800;color:var(--navy);font-size:15px;line-height:1.1}
.demobar .t small{display:block;font-weight:600;color:var(--ink-3);font-size:11.5px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(11,30,115,.12)}
.notes-toggle{font-size:13px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:6px}

/* ---------- portada ---------- */
.portada{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:40px 20px;background:
 radial-gradient(1200px 500px at 0% 100%, rgba(112,178,52,.12), transparent 60%),
 radial-gradient(900px 500px at 100% 0%, rgba(1,136,200,.12), transparent 60%), #F7FAFC}
.portada .wrap{max-width:980px;width:100%}
.p-logos{display:flex;align-items:center;gap:22px;margin-bottom:28px}
.p-logos .vf{height:96px}
.sello{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--green-50);color:#3F7A12;font-weight:800;font-size:12.5px;letter-spacing:.02em}
.sello b{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.sello b svg{width:14px;height:14px}
.portada h1{font-size:46px;line-height:1.05;margin:14px 0 12px;color:var(--navy);font-weight:900;letter-spacing:-.02em}
.portada p.lead{font-size:19px;color:var(--ink-2);max-width:680px;margin:0 0 34px;line-height:1.45}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.role{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:10px}
.role:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(11,30,115,.10);border-color:#cfdcea}
.role .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.role h3{margin:4px 0 0;font-size:21px;color:var(--navy)}
.role p{margin:0;color:var(--ink-2);line-height:1.45}
.role .go{margin-top:6px;font-weight:800;color:var(--blue);display:flex;align-items:center;gap:4px}
.tenant{margin-top:26px;display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13.5px;font-weight:600}
.tenant img{height:30px}

/* ---------- stage (colaborador) ---------- */
.stage{display:flex;justify-content:center;align-items:flex-start;gap:36px;padding:28px 20px 40px;min-height:calc(100vh - 56px)}
.side{width:250px;flex:none;position:sticky;top:84px}
.side h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.side .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.side .nav button .c{font-size:11px;font-weight:800;color:var(--ink-3);width:24px}
.side .nav button:hover{background:#fff}
.side .nav button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(11,30,115,.08)}
.side .nav button.demo .c{color:var(--green)}
.legend{margin-top:12px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}

.phone{width:390px;height:812px;flex:none;background:#0d1330;border-radius:52px;padding:12px;box-shadow:0 30px 80px rgba(11,30,115,.25),0 0 0 2px #2a3157 inset}
.screen{width:100%;height:100%;background:var(--bg);border-radius:41px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:800;background:inherit}
.status .notch{width:110px;height:30px;background:#0d1330;border-radius:20px;position:absolute;left:50%;transform:translateX(-50%);top:8px}
.status .r{display:flex;gap:5px;align-items:center}
.status .r span{width:16px;height:10px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.status .r span:after{content:"";position:absolute;inset:1px 3px 1px 1px;background:var(--ink);border-radius:1px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:6px 20px 24px}

.notes{width:290px;flex:none;position:sticky;top:84px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.notes .code{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--green)}
.notes h3{margin:4px 0 10px;font-size:17px;color:var(--navy)}
.notes ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.notes li{margin-bottom:6px}
.notes .tip{margin-top:12px;padding:10px 12px;background:var(--blue-50);border-radius:12px;font-size:12.5px;color:var(--navy);line-height:1.45}
.hide-notes .notes{display:none}

/* ---------- app components ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 16px 10px}
.topbar .back{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.topbar h2{margin:0;font-size:18px;font-weight:800;color:var(--navy)}
.hello{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 6px}
.hello .who small{color:var(--ink-3);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
.hello .who small img{height:14px}
.hello h1{margin:2px 0 0;font-size:25px;font-weight:900;color:var(--navy);letter-spacing:-.01em}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex:none}
.av-l{background:linear-gradient(135deg,var(--blue),var(--cyan))}
.av-r{background:linear-gradient(135deg,#8A6FD1,#B39AE8)}
.av-t{background:linear-gradient(135deg,var(--green),#9ACD62)}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.stack>*+*{margin-top:12px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;font-weight:800;font-size:15.5px;width:100%}
.btn.pri{background:var(--navy);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost{color:var(--ink-2);height:44px}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}
.chip.g{background:var(--green-50);color:#3F7A12}
.chip.b{background:var(--blue-50);color:#05679A}
.chip.n{background:#EEF0F7;color:var(--ink-2)}
.chip.w{background:var(--warn-50);color:var(--warn)}
.chip svg{width:13px;height:13px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.hero{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(140deg,var(--navy) 0%,#0F3C9E 55%,var(--blue) 100%);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(112,178,52,.55)}
.hero:before{content:"";position:absolute;right:20px;bottom:-90px;width:170px;height:170px;border-radius:50%;border:16px solid rgba(0,160,209,.45)}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h3{margin:6px 0 6px;font-size:21px;line-height:1.2;font-weight:900}
.hero p{margin:0 0 14px;color:rgba(255,255,255,.85);font-size:14px;line-height:1.45}
.hero .btn{background:#fff;color:var(--navy);height:46px}
.progress{height:8px;background:#E6EDF5;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#93C95A);border-radius:99px}
.mods{display:flex;gap:5px;margin-top:10px}
.mods span{flex:1;height:6px;border-radius:9px;background:#E6EDF5}
.mods span.done{background:var(--green)}
.mods span.now{background:linear-gradient(90deg,var(--green) 80%,#E6EDF5 80%)}
.mods-l{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px;font-weight:700;font-size:11px;color:var(--ink-3)}
.ph{display:inline-block;border-radius:50%;overflow:hidden;flex:none;line-height:0}
.ph svg{width:100%;height:100%}
.stack-av{display:flex}.stack-av .ph{border:2px solid #fff;margin-left:-8px}.stack-av .ph:first-child{margin-left:0}
.cam{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.cam svg{width:11px;height:11px}
/* whatsapp preview */
.wa{display:flex;flex-direction:column;min-height:100%;background:#EFE7DE}
.wa-h{background:#0B5C4E;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
.wa-h .lg{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.wa-h .lg img{width:34px}
.wa-b{flex:1;padding:12px 10px 20px;display:flex;flex-direction:column;gap:8px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.wa-day{align-self:center;background:#fff;color:#54656F;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px;box-shadow:0 1px .5px rgba(0,0,0,.1)}
.bub{max-width:84%;background:#fff;border-radius:10px;padding:8px 10px 6px;font-size:14px;line-height:1.4;box-shadow:0 1px .5px rgba(0,0,0,.12);align-self:flex-start;color:#111B21}
.bub.me{align-self:flex-end;background:#D9FDD3}
.bub small{display:block;text-align:right;font-size:10.5px;color:#667781;margin-top:2px}
.bub .wbtn{display:flex;justify-content:center;align-items:center;gap:6px;border-top:1px solid #E9EDEF;margin:8px -10px -6px;padding:9px;color:#027EB5;font-weight:700;font-size:14px;width:calc(100% + 20px)}
.qr{display:flex;flex-direction:column;gap:5px;max-width:84%}
.qr button{background:#fff;border-radius:10px;padding:9px;color:#027EB5;font-weight:700;font-size:14px;box-shadow:0 1px .5px rgba(0,0,0,.12)}
.wa-f{background:#F0F2F5;padding:10px 12px;font-size:11.5px;color:#54656F;text-align:center;line-height:1.4}
/* album */
.alb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.mem .pic{height:96px;display:grid;place-items:center;position:relative}
.mem .pic svg.i{width:34px;height:34px;color:#fff;stroke-width:1.8}
.mem .pic .tag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);color:var(--navy);font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:99px}
.mem .tx{padding:9px 10px 11px}
.mem .tx b{font-size:13px;display:block;color:var(--navy);line-height:1.25}
.mem .tx span{font-size:12px;color:var(--ink-2);display:block;margin-top:4px;line-height:1.35;font-style:italic}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.badge{text-align:center;font-size:11px;font-weight:800;color:var(--ink-3)}
.badge i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px;background:#EEF0F7;font-style:normal}
.badge.now i{background:conic-gradient(var(--green) 0 80%,#E6EDF5 80% 100%);}
.badge.now i b{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#3F7A12;font-size:11px}
.badge.now{color:var(--navy)}
.qd{background:linear-gradient(160deg,#fff 0%,var(--cyan-50) 100%)}
.qd h4{margin:6px 0 12px;font-size:16.5px;line-height:1.3;color:var(--navy)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:11px 10px;border-radius:13px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;text-align:center}
.opt:hover{border-color:var(--cyan)}
.opt.full{grid-column:1/-1;font-weight:600;color:var(--ink-3);border-style:dashed}
.listitem{display:flex;align-items:center;gap:12px;padding:12px 0}
.listitem+.listitem{border-top:1px solid var(--line)}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico.g{background:var(--green-50);color:#4C8E1E}
.ico.b{background:var(--blue-50);color:var(--blue)}
.ico.c{background:var(--cyan-50);color:#0089B4}
.ico.n{background:#EEF0F7;color:var(--navy)}
.ico.w{background:var(--warn-50);color:var(--warn)}
.li-t{font-weight:800;font-size:14.5px;line-height:1.25}
.li-s{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.tabnav{height:78px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px 20px}
.tabnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-3)}
.tabnav button.on{color:var(--navy)}
.tabnav button.on svg{stroke:var(--blue)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:9px 13px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 40px;font-size:14.5px;line-height:1.45}
.steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:27px;height:27px;border-radius:50%;background:var(--green-50);color:#3F7A12;font-weight:900;display:grid;place-items:center;font-size:13px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--blue-50);color:var(--navy);font-size:13px;line-height:1.45;font-weight:600}
.notice svg{width:18px;height:18px;margin-top:1px}
.notice.g{background:var(--green-50);color:#2F5E0C}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:14px;line-height:1.4;text-align:left;width:100%}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #C4CFDF;flex:none;display:grid;place-items:center;background:#fff}
.box.on{background:var(--green);border-color:var(--green);color:#fff}
.box svg{width:15px;height:15px;stroke-width:3}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:10px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.toggle{width:46px;height:28px;border-radius:99px;background:#D3DBE7;position:relative;flex:none;transition:.15s}
.toggle:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on:after{left:21px}
.scale{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.scale button{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;text-align:left;font-weight:700;font-size:14px}
.scale button.on{border-color:var(--blue);background:var(--blue-50);color:var(--navy)}
.qtext{font-weight:800;font-size:15.5px;line-height:1.35;color:var(--navy)}
.dots{display:flex;gap:4px}
.dots span{flex:1;height:5px;border-radius:9px;background:#E1E8F1}
.dots span.on{background:var(--blue)}
.dots span.done{background:var(--green)}
.sheet-bg{position:absolute;inset:0;background:rgba(11,20,50,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:10px 20px 30px;animation:up .2s}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#D5DCE7;margin:0 auto 14px}
.sheet h3{margin:0 0 8px;color:var(--navy);font-size:19px}
.sheet p{color:var(--ink-2);line-height:1.5;margin:0 0 16px;font-size:14.5px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:16px;right:16px;bottom:94px;background:var(--navy);color:#fff;padding:13px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:30;display:flex;gap:10px;align-items:center;animation:up .2s}
.toast svg{stroke:#9AD65E}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.face{padding:12px 4px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.face b{display:block;font-size:26px;margin-bottom:4px}
.face.on{border-color:var(--green);background:var(--green-50)}
textarea{width:100%;min-height:96px;border-radius:14px;border:1.5px solid var(--line);padding:12px;font:inherit;font-size:14px;resize:none;background:#fff}
.player{background:var(--navy);color:#fff;border-radius:18px;padding:14px}
.player .pb{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center}
.player .pb svg{fill:var(--navy);stroke:none}
.player .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.player .bar i{display:block;height:100%;width:34%;background:var(--green)}
.playing .bar i{animation:prog 30s linear infinite}
@keyframes prog{to{width:100%}}
.therm{display:flex;flex-direction:column;gap:14px}
.th-row .lbl{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}
.th-bars{display:flex;align-items:flex-end;gap:5px;height:54px}
.th-bars span{flex:1;border-radius:6px 6px 3px 3px;background:var(--cyan-50)}
.th-bars span.v{background:linear-gradient(180deg,var(--cyan),var(--blue))}
.th-bars span.g{background:linear-gradient(180deg,#93C95A,var(--green))}
.member{display:flex;gap:12px;align-items:center;padding:14px}
.dom{display:flex;align-items:center;gap:10px;padding:10px 0}
.dom+.dom{border-top:1px solid var(--line)}
.dom .meter{width:84px;height:7px;border-radius:9px;background:#E6EDF5;overflow:hidden}
.dom .meter i{display:block;height:100%;border-radius:9px}
.help-hero{background:linear-gradient(150deg,#FFF6F0,#FFFFFF);border:1px solid #FBE1D2}
.line-card{display:flex;align-items:center;gap:12px;padding:13px 0}
.line-card+.line-card{border-top:1px solid var(--line)}
.num{font-weight:900;color:var(--navy);font-size:15px}
.ws-card{display:flex;gap:12px}
.ws-date{align-self:flex-start;width:54px;flex:none;border-radius:14px;background:var(--blue-50);text-align:center;padding:8px 0;color:var(--navy)}
.ws-date b{display:block;font-size:20px;line-height:1;font-weight:900}
.ws-date small{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--blue)}
.mod{display:flex;gap:14px;padding:14px;align-items:center}
.mod .n{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:900;flex:none}
.mod.done .n{background:var(--green);color:#fff}
.mod.now{border:2px solid var(--blue)}
.mod.now .n{background:var(--blue);color:#fff}
.mod.next .n{background:#EEF0F7;color:var(--ink-3)}
.mod.next{opacity:.85}
.empty-emp{max-width:640px;margin:80px auto;text-align:center;color:var(--ink-2)}
.empty-emp h2{color:var(--navy)}
.big-text .screen{font-size:17px}
.big-text .li-t{font-size:16.5px}.big-text .qtext{font-size:18px}.big-text .steps li{font-size:16.5px}.big-text .hero h3{font-size:24px}.big-text .small,.big-text .li-s{font-size:14.5px}.big-text .hello h1{font-size:28px}
.contrast .screen{--ink-2:#1B2440;--ink-3:#2D3756;--line:#9AA6BD;--bg:#fff}
.contrast .card{border-width:2px}
@media (max-width:1180px){.notes{display:none}}
@media (max-width:860px){.side{display:none}}
@media (max-width:480px){
  .stage{padding:0}
  .phone{width:100vw;height:calc(100vh - 56px);border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .status{display:none}
  .roles{grid-template-columns:1fr}
  .portada h1{font-size:34px}
  .demobar .t small{display:none}
}

/* ---------- empresa ---------- */
.emp{display:grid;grid-template-columns:244px 1fr;min-height:calc(100vh - 56px);background:#F5F8FB}
.e-side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:2px;overflow:hidden;position:sticky;top:56px;height:calc(100vh - 56px)}
.e-side .ten{display:flex;flex-direction:column;gap:6px;padding:4px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.e-side .ten img{height:30px;align-self:flex-start}
.e-side .ten small{font-size:12px;color:var(--ink-3);font-weight:700}
.e-side button.nv{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink-2);text-align:left}
.e-side button.nv:hover{background:var(--bg)}
.e-side button.nv.on{background:var(--blue-50);color:var(--navy)}
.e-side button.nv.on svg{color:var(--blue)}
.e-side button.nv .dm{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--green)}
.e-side .own{flex:none;margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);font-weight:700;line-height:1.3}
.e-side .own img{height:40px}
.e-main{padding:26px 34px 60px;max-width:1240px;width:100%}
.e-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}
.e-head h1{margin:0;font-size:27px;color:var(--navy);font-weight:900;letter-spacing:-.01em}
.e-head p{margin:4px 0 0;color:var(--ink-3);font-weight:600}
.e-user{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.e-user .av{width:36px;height:36px;border-radius:50%;background:#EEF0F7;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:13px}
.priv{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:18px}
.priv svg{color:var(--green)}
.priv .per{margin-left:auto;white-space:nowrap;font-weight:800;color:var(--navy);background:var(--blue-50);padding:4px 10px;border-radius:99px;font-size:12px}
.eg{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g32{grid-template-columns:3fr 2fr}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.panel h3{margin:0;font-size:15.5px;color:var(--navy);font-weight:800}
.panel .sub{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:3px}
.ph-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.kpi .lbl{font-size:12.5px;color:var(--ink-3);font-weight:700}
.kpi .val{font-size:30px;font-weight:900;color:var(--navy);margin:4px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .ft{font-size:12.5px;color:var(--ink-2);font-weight:600}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:16px}
.lk{background:#fff;border:1px solid var(--line);padding:14px 16px 14px 22px;position:relative;text-align:left}
.lk:first-child{border-radius:16px 0 0 16px;padding-left:16px}
.lk:last-child{border-radius:0 16px 16px 0}
.lk+.lk{border-left:0}
.lk:not(:last-child):after{content:"";position:absolute;right:-9px;top:50%;width:16px;height:16px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:2}
.lk .n{font-size:11px;font-weight:900;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.lk .t{font-weight:800;color:var(--navy);font-size:14px;margin:2px 0 6px}
.lk .v{font-size:20px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.lk .d{font-size:12px;color:var(--ink-3);font-weight:600;margin:2px 0 8px;line-height:1.3}
.lk:hover{background:#FAFCFE}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
.st svg{width:12px;height:12px;stroke-width:3}
.st.ok{background:var(--green-50);color:#3F7A12}
.st.pend{background:#EEF0F7;color:var(--ink-2)}
.st.part{background:var(--warn-50);color:var(--warn)}
.legend2{display:flex;flex:none;gap:14px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink-2)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart text{font-family:Nunito,sans-serif}
.pb-row{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;padding:7px 0}
.pb-row+.pb-row{border-top:1px solid #F0F3F8}
.pb-row .l{font-size:13px;font-weight:700;color:var(--ink);line-height:1.25}
.pb-row .l small{display:block;color:var(--ink-3);font-weight:600;font-size:11.5px}
.pb-bars{display:flex;flex-direction:column;gap:2px}
.pb{display:flex;align-items:center;gap:8px;height:12px}
.pb i{display:block;height:10px;border-radius:0 4px 4px 0;min-width:2px}
.pb span{white-space:nowrap;font-size:11.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:900;padding:2px 7px;border-radius:99px;white-space:nowrap}
.delta.good{background:var(--green-50);color:#3F7A12}
.delta.flat{background:#EEF0F7;color:var(--ink-2)}
.caveat{display:flex;gap:10px;background:var(--warn-50);border-radius:12px;padding:11px 14px;font-size:12.5px;color:#7A4A00;line-height:1.5;font-weight:600}
.caveat svg{color:var(--warn);margin-top:1px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:11px 10px;border-bottom:1px solid #F0F3F8;font-weight:600;font-variant-numeric:tabular-nums}
table.t td.num,table.t th.num{text-align:right}
table.t tr.hid td{color:var(--ink-3);background:repeating-linear-gradient(135deg,#FAFBFD 0 8px,#F3F6FA 8px 16px)}
.lockcell{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;color:var(--ink-3)}
.lockcell svg{width:14px;height:14px}
.seg2{display:inline-flex;background:var(--bg);padding:3px;border-radius:10px;gap:2px}
.seg2 button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.seg2 button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hyp{display:flex;flex-direction:column;gap:8px}
.hyp .hn{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:.05em}
.hyp h4{margin:0;font-size:15.5px;color:var(--navy);line-height:1.3}
.hyp p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.hyp .ev{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.hyp .ev b{color:var(--navy);font-size:17px;font-variant-numeric:tabular-nums}
.ebtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;font-weight:800;font-size:13.5px}
.ebtn.pri{background:var(--navy);color:#fff}
.ebtn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.ebtn svg{width:17px;height:17px}
.rep{display:flex;gap:14px;align-items:flex-start}
.rep .ico{width:48px;height:48px}
.rep h4{margin:0 0 4px;color:var(--navy);font-size:15px}
.rep p{margin:0 0 12px;font-size:13px;color:var(--ink-2);line-height:1.5}
.ent li{display:flex;gap:10px;padding:8px 0;font-size:13.5px;font-weight:600;color:var(--ink);border-bottom:1px solid #F0F3F8}
.ent li svg{color:var(--green);width:18px;height:18px}
.ent{list-style:none;margin:0;padding:0}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:9px;line-height:1.35;max-width:260px;box-shadow:0 6px 18px rgba(11,30,115,.25);display:none}
.e-notes{margin-top:14px;background:var(--bg);border-radius:14px;padding:13px 14px;overflow:auto;min-height:0}
.e-notes .code{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--green)}
.e-notes h3{margin:4px 0 6px;font-size:14.5px;color:var(--navy)}
.e-notes ul{margin:0;padding-left:16px;color:var(--ink-2);font-size:12.5px;line-height:1.45}
.e-notes .tip{margin-top:8px;padding:8px 10px;background:#fff;border-radius:11px;font-size:12.5px;color:var(--navy);line-height:1.45}
.modal-bg{position:fixed;inset:0;background:rgba(11,20,50,.5);z-index:150;display:grid;place-items:center;padding:30px;animation:fade .15s}
.doc{background:#fff;width:640px;max-height:88vh;overflow:auto;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.3);padding:44px 50px;position:relative}
.doc h1{font-size:24px;color:var(--navy);margin:14px 0 4px}
.doc h2{font-size:15px;color:var(--navy);margin:22px 0 8px;border-bottom:2px solid var(--green-50);padding-bottom:4px}
.doc p,.doc li{font-size:13px;line-height:1.6;color:var(--ink-2)}
.doc .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.etoast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:180;display:flex;gap:10px;align-items:center;animation:up .2s}
.etoast svg{stroke:#9AD65E}
textarea.inv{min-height:84px;font-size:13px}
.hide-notes .e-notes{display:none}
@media (max-width:1100px){.g4,.g5{grid-template-columns:1fr 1fr}.chain{grid-template-columns:1fr 1fr}.g32,.g2{grid-template-columns:1fr}.e-notes{display:none}}

.pt .cx{opacity:0}.pt:hover .cx{opacity:1}

const C_INI='#5AACE6', C_FIN='#1F4FB0';
const fmt1=v=>String(v).replace('.',',');
function lineChart(o){
 const W=o.w||640,H=o.h||200,pl=34,pr=46,pt=14,pb=26,n=o.vals.length;
 const X=i=>pl+i*(W-pl-pr)/(n-1), Y=v=>pt+(1-(v-o.min)/(o.max-o.min))*(H-pt-pb);
 const ticks=o.ticks||[o.min,(o.min+o.max)/2,o.max];
 const d=o.vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
 const step=(W-pl-pr)/(n-1);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
  ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#EDF1F6"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="#7C86A2" font-weight="600">${o.fmt(t)}</text>`).join('')}
  ${o.labels.map((l,i)=>(i%(o.every||1)===0||i===n-1)?`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#7C86A2" font-weight="600">${l}</text>`:'').join('')}
  <path d="${d}" fill="none" stroke="${o.color||C_FIN}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${X(n-1)}" cy="${Y(o.vals[n-1])}" r="4" fill="${o.color||C_FIN}" stroke="#fff" stroke-width="2"/>
  <text x="${X(n-1)+8}" y="${Y(o.vals[n-1])+4}" font-size="12" font-weight="800" fill="#1B2440">${o.fmt(o.vals[n-1])}</text>
  ${o.vals.map((v,i)=>`<g class="pt"><rect x="${X(i)-step/2}" y="${pt}" width="${step}" height="${H-pt-pb}" fill="transparent" data-tip="${o.tipLabel?o.tipLabel(i):o.labels[i]}: ${o.fmt(v)}"/><line class="cx" x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${H-pb}" stroke="#C9D3E2" stroke-dasharray="3 3"/><circle class="cx" cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${o.color||C_FIN}" stroke="#fff" stroke-width="2"/></g>`).join('')}
 </svg>`;
}
function pairBars(rows,max,unit,lowerBetter){
 return rows.map(r=>{
  const dlt=r.b-r.a, good=lowerBetter?dlt<0:dlt>0;
  return `<div class="pb-row"><div class="l">${r.l}${r.sub?`<small>${r.sub}</small>`:''}</div>
   <div class="row" style="gap:12px"><div class="pb-bars grow">
    <div class="pb"><i style="width:${r.a/max*100}%;background:${C_INI}" data-tip="${r.l} · inicial: ${r.a}${unit}"></i><span>${r.a}${unit}</span></div>
    <div class="pb"><i style="width:${r.b/max*100}%;background:${C_FIN}" data-tip="${r.l} · final: ${r.b}${unit}"></i><span>${r.b}${unit}</span></div>
   </div><span class="delta ${good?'good':'flat'}">${dlt>0?'+':''}${dlt}${unit===' %'?' pts':''}</span></div></div>`;}).join('');
}
function hbars(rows,max,f,color){
 return rows.map(r=>`<div class="pb-row" style="grid-template-columns:150px 1fr"><div class="l">${r.l}${r.sub?`<small>${r.sub}</small>`:''}</div>
  <div class="pb" style="height:16px"><i style="height:14px;width:${Math.abs(r.v)/max*100}%;background:${color||C_FIN}" data-tip="${r.l}: ${f(r.v)}"></i><span>${f(r.v)}</span></div></div>`).join('');
}

function etoast(msg){S.etoast=msg;render();clearTimeout(etoast.t);etoast.t=setTimeout(()=>{S.etoast=null;render();},2600);}
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-epage]'); if(p){S.epage=p.dataset.epage;S.view='empresa';render();setHash();window.scrollTo(0,0);return;}
 const a=e.target.closest('[data-eact]'); if(!a) return;
 switch(a.dataset.eact){
  case 'preview': S.modal='preview'; break;
  case 'close': S.modal=null; break;
  case 'dl': etoast('En la maqueta la descarga es simulada'); return;
  case 'digest': S.digest=!S.digest; break;
  case 'remind': etoast('Recordatorio enviado a quienes no han activado su cuenta'); return;
  case 'invite': etoast('Invitaciones enviadas'); return;
  case 'csv': etoast('Carga de CSV simulada'); return;
  case 'req': etoast('Solicitud enviada a la Fundación'); return;
  case 'renew': etoast('La Fundación te contactará para la renovación'); return;
 }
 render();
});
/* tooltip */
const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]'); if(t){tip.textContent=t.dataset.tip;tip.style.display='block';}});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]')) tip.style.display='none';});
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}});

/* ---------- render & routing ---------- */
let lastScreen=null;
function render(){
 const app=document.getElementById('app');
 const prevScroll = document.getElementById('body')?.scrollTop||0;
 document.body.classList.toggle('big-text',S.bigText);
 document.body.classList.toggle('contrast',S.contrast);
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
 document.getElementById('notesToggle').style.visibility = S.view==='portada'?'hidden':'visible';
 document.getElementById('notesToggle').textContent = S.notes?'Ocultar notas':'Mostrar notas';
 app.innerHTML = S.view==='portada'?portada():S.view==='colab'?colab():empresa();
 const b=document.getElementById('body');
 if(b){ b.scrollTop = (lastScreen===S.screen)?prevScroll:0; }
 lastScreen=S.screen;
}
function setHash(){
 const h = S.view==='colab' ? 'c-'+S.screen : S.view==='empresa' ? 'e-'+S.epage : S.view;
 if(location.hash!=='#'+h) history.replaceState(null,'','#'+h);
}
function go(id){
 if(id==='autodx'&&S.screen!=='autodx') S.adx=0;
 if(id==='bienestar'&&S.screen!=='bienestar') S.wb=0;
 if(id==='bienvenida') S.ob=0;
 S.screen=id; S.view='colab'; S.sheet=null; render(); setHash();
}
function fromHash(){
 const h=location.hash.slice(1);
 if(h.startsWith('c-')&&R[h.slice(2)]){ if(S.view!=='colab'||S.screen!==h.slice(2)) go(h.slice(2)); return; }
 else if(h.startsWith('e-')&&EP[h.slice(2)]){S.view='empresa';S.epage=h.slice(2);}
 else if(['portada','empresa','colab'].includes(h)) S.view=h;
 render();
}
document.addEventListener('click',e=>{
 const v=e.target.closest('[data-view]'); if(v){S.view=v.dataset.view; render(); setHash(); window.scrollTo(0,0); return;}
 const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return;}
 const a=e.target.closest('[data-act]'); if(!a) return;
 const val=a.dataset.v;
 switch(a.dataset.act){
  case 'ob-next': S.ob++; break;
  case 'tg-consent': S.consent=!S.consent; break;
  case 'tg-consentwa': S.consentWA=!S.consentWA; break;
  case 'tg-consentqd': S.consentQD=!S.consentQD; S.qdOn=S.consentQD; break;
  case 'hogar': S.hogar.has(val)?S.hogar.delete(val):S.hogar.add(val); break;
  case 'tg-big': S.bigText=!S.bigText; break;
  case 'tg-con': S.contrast=!S.contrast; break;
  case 'tg-easy': S.easyRead=!S.easyRead; break;
  case 'tg-qd': S.qdOn=!S.qdOn; break;
  case 'qd': S.qd=val; break;
  case 'var': S.variant=val; break;
  case 'sheet': S.sheet=val; break;
  case 'close-sheet': S.sheet=null; break;
  case 'skip-ok': S.sheet=null; S.screen='inicio'; render(); setHash(); toast('Reto en pausa. Lo encuentras en tu programa.'); return;
  case 'face': S.face=+val; break;
  case 'reto-done': S.retoDone=true; S.screen='inicio'; render(); setHash(); toast('¡Reto guardado en el álbum de la familia!'); return;
  case 'addphoto': S.photoAdded=true; break;
  case 'wa': S.wa=val; break;
  case 'open-taller': S.tallerId=val; go('taller'); return;
  case 'who': S.enrollWho=new Set([val]); break;
  case 'enroll': S.enrolled=true; break;
  case 'rf': S.resFilter=val; break;
  case 'play': S.playing=!S.playing; break;
  case 'adx': S.adx=+val; render(); document.getElementById('body').scrollTop=0; return;
  case 'adx-ans': S.adxAns[a.dataset.q]=+val; break;
  case 'wb': S.wb=+val; render(); document.getElementById('body').scrollTop=0; return;
  case 'wb-ans': S.wbAns=+val; break;
  case 'help': S.help=true; break;
 }
 render();
});
document.getElementById('notesToggle').onclick=()=>{S.notes=!S.notes;render();};
window.addEventListener('hashchange',fromHash);
fromHash();
</script>
